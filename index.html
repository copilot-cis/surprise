<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СЮРПРИЗ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
  }

  .screen {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, #ffffff 0%, #fff7fb 45%, #ffeaf4 100%);
  }

  .intro {
  text-align: center;
  position: relative;
  z-index: 100;
  transition: opacity .35s ease, transform .35s ease;
}

  .intro.hidden {
    opacity: 0;
    transform: scale(.8);
    pointer-events: none;
  }

  .hint {
    font-size: 15px;
    letter-spacing: 3px;
    color: #777;
    margin-bottom: 24px;
  }

  button {
  display: inline-block;
  position: relative;
  z-index: 100;
  border: none;
  cursor: pointer;
  color: white;
  font-weight: 900;
  letter-spacing: 1px;
  border-radius: 999px;
  padding: 20px 42px;
  font-size: 21px;
  line-height: 1.2;
  background: linear-gradient(135deg, #ff4f91, #ff176f);
  box-shadow: 0 14px 35px rgba(255, 23, 111, .28);
  transition: transform .12s ease;
  pointer-events: auto;
}

button:hover {
  transform: scale(1.05);
}

button:active {
  transform: scale(.96);
}

  .dark {
    position: absolute;
    inset: 0;
    background: #050507;
    opacity: 0;
    pointer-events: none;
    transition: opacity .7s ease;
    z-index: 20;
  }

  .dark.on { opacity: 1; }

  .wait {
    position: absolute;
    z-index: 30;
    color: white;
    font-size: clamp(28px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: 8px;
    opacity: 0;
    transform: scale(.7);
    text-align: center;
  }

  .wait.show {
    animation: waitAnim 2.2s ease forwards;
  }

  @keyframes waitAnim {
    0% { opacity: 0; transform: scale(.7); }
    20% { opacity: 1; transform: scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.2); }
  }

  .boom {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    opacity: 0;
    pointer-events: none;
  }

  .boom.flash { animation: flash .55s ease-out forwards; }

  @keyframes flash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  .result {
    position: absolute;
    z-index: 50;
    text-align: center;
    width: 100%;
    padding: 20px;
    opacity: 0;
    transform: scale(.15) rotate(-8deg);
    pointer-events: none;
  }

  .result.show {
    animation: reveal 1s cubic-bezier(.17,.89,.32,1.35) forwards;
  }

  .result h1 {
    margin: 0;
    font-size: clamp(48px, 13vw, 150px);
    line-height: .9;
    font-weight: 1000;
    color: #ff176f;
    text-shadow:
      5px 5px 0 #ffd1e2,
      0 0 35px rgba(255, 23, 111, .45);
  }

  .goat {
    font-size: clamp(65px, 15vw, 160px);
    display: inline-block;
    margin-top: 15px;
    animation: goat .7s infinite alternate ease-in-out;
  }

  @keyframes reveal {
    0% { opacity: 0; transform: scale(.15) rotate(-8deg); }
    65% { opacity: 1; transform: scale(1.12) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }

  @keyframes goat {
    from { transform: rotate(-8deg) translateY(0); }
    to { transform: rotate(8deg) translateY(-12px); }
  }

  .again {
    margin-top: 25px;
    padding: 14px 28px;
    font-size: 16px;
    background: #111;
    box-shadow: none;
    opacity: 0;
  }

  .result.show .again {
    animation: fadeButton .5s 1s forwards;
  }

  @keyframes fadeButton { to { opacity: 1; } }

  .particle {
    position: absolute;
    z-index: 45;
    top: -10vh;
    pointer-events: none;
    animation: fall linear forwards;
    user-select: none;
  }

  @keyframes fall {
    from { transform: translate3d(0, -10vh, 0) rotate(0deg); }
    to { transform: translate3d(var(--drift), 115vh, 0) rotate(var(--spin)); }
  }

  .shake { animation: shake .45s ease-in-out; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px) rotate(-2deg); }
    40% { transform: translateX(10px) rotate(2deg); }
    60% { transform: translateX(-7px) rotate(-1deg); }
    80% { transform: translateX(7px) rotate(1deg); }
  }

  .tiny {
    position: absolute;
    bottom: 18px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="screen" id="screen">

  <div class="intro" id="intro">
    <div class="hint">ТУТ НИЧЕГО НЕ ПРОИСХОДИТ</div>
    <button id="mainBtn">НАЖМИ МЕНЯ</button>
  </div>

  <div class="dark" id="dark"></div>
  <div class="wait" id="wait">ПОДОЖДИ<span>…</span></div>
  <div class="boom" id="boom"></div>

  <div class="result" id="result">
    <h1>НАДЯ<br>КОЗА</h1>
    <div class="goat">🐐</div><br>
    <button class="again" id="again">ЕЩЁ РАЗ 😂</button>
  </div>

  <div class="tiny">СЮРПРИЗ • 100% НАУЧНО ДОКАЗАНО</div>
</div>

<script>
const screen = document.getElementById('screen');
const intro = document.getElementById('intro');
const dark = document.getElementById('dark');
const wait = document.getElementById('wait');
const boom = document.getElementById('boom');
const result = document.getElementById('result');
const mainBtn = document.getElementById('mainBtn');
const again = document.getElementById('again');

let busy = false;

function sound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const now = ctx.currentTime;

    const notes = [220, 330, 440, 660];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = i === 3 ? 'square' : 'sine';
      osc.frequency.setValueAtTime(freq, now + i * .11);
      gain.gain.setValueAtTime(0.0001, now + i * .11);
      gain.gain.exponentialRampToValueAtTime(.18, now + i * .11 + .025);
      gain.gain.exponentialRampToValueAtTime(.0001, now + i * .11 + .28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * .11);
      osc.stop(now + i * .11 + .3);
    });

    // Boom
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(110, now + .55);
    osc.frequency.exponentialRampToValueAtTime(45, now + 1.0);
    gain.gain.setValueAtTime(.0001, now + .55);
    gain.gain.exponentialRampToValueAtTime(.35, now + .57);
    gain.gain.exponentialRampToValueAtTime(.0001, now + 1.0);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + .55);
    osc.stop(now + 1.05);
  } catch(e) {}
}

function particles() {
  const symbols = ['🐐','💖','💕','💗','✨','🎉','😂','⭐','🐐','💥'];
  for (let i = 0; i < 75; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (18 + Math.random() * 34) + 'px';
    p.style.animationDuration = (2.2 + Math.random() * 3.5) + 's';
    p.style.animationDelay = (Math.random() * .8) + 's';
    p.style.setProperty('--drift', (Math.random() * 240 - 120) + 'px');
    p.style.setProperty('--spin', (Math.random() * 1000 - 500) + 'deg');
    screen.appendChild(p);
    setTimeout(() => p.remove(), 6500);
  }
}

function reset() {
  // Удаляем старые конфетти и коз
  document.querySelectorAll('.particle').forEach(p => p.remove());

  // Полностью сбрасываем состояние
  result.classList.remove('show');
  dark.classList.remove('on');
  wait.classList.remove('show');
  boom.classList.remove('flash');
  intro.classList.remove('hidden');
  screen.classList.remove('shake');

  // Принудительно сбрасываем CSS-анимации
  void result.offsetWidth;
  void wait.offsetWidth;
  void boom.offsetWidth;

  // Теперь кнопка снова может запускать сюрприз
  busy = false;

  // Запускаем заново
  surprise();
}

function surprise() {
  if (busy) return;
  busy = true;

  intro.classList.add('hidden');
  dark.classList.add('on');
  sound();

  setTimeout(() => {
    wait.classList.add('show');
  }, 350);

  setTimeout(() => {
    screen.classList.add('shake');
    boom.classList.add('flash');
    particles();
  }, 2300);

  setTimeout(() => {
    dark.classList.remove('on');
    result.classList.add('show');
    screen.classList.remove('shake');
  }, 2450);
}

mainBtn.addEventListener('click', surprise);
again.addEventListener('click', reset);
</script>
</body>
</html>
