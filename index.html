<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Надя Коза</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f7f0ff, #fff7df);
        overflow: hidden;
    }
    .wrap { text-align: center; }
    button {
        border: 0;
        border-radius: 22px;
        padding: 24px 42px;
        font-size: 28px;
        font-weight: 800;
        cursor: pointer;
        background: white;
        box-shadow: 0 12px 30px rgba(0,0,0,.15);
        transition: transform .12s, box-shadow .12s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 16px 35px rgba(0,0,0,.18); }
    button:active { transform: scale(.96); }
    #result {
        margin-top: 35px;
        min-height: 90px;
        font-size: clamp(38px, 8vw, 86px);
        font-weight: 1000;
        letter-spacing: 2px;
        opacity: 0;
        transform: scale(.5) rotate(-8deg);
    }
    #result.show { animation: goat .65s cubic-bezier(.2,1.6,.4,1) forwards; }
    @keyframes goat {
        0% { opacity: 0; transform: scale(.5) rotate(-8deg); }
        70% { opacity: 1; transform: scale(1.12) rotate(3deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .shake { animation: shake .35s; }
    @keyframes shake {
        20% { transform: translateX(-8px) rotate(-2deg); }
        40% { transform: translateX(8px) rotate(2deg); }
        60% { transform: translateX(-6px) rotate(-1deg); }
        80% { transform: translateX(6px) rotate(1deg); }
    }
</style>
</head>
<body>
<div class="wrap">
    <button id="go">НАЖМИ МЕНЯ</button>
    <div id="result">НАДЯ КОЗА 🐐</div>
</div>

<script>
const button = document.getElementById('go');
const result = document.getElementById('result');

button.addEventListener('click', () => {
    result.classList.remove('show');
    void result.offsetWidth;
    result.classList.add('show');

    button.classList.remove('shake');
    void button.offsetWidth;
    button.classList.add('shake');
});
</script>
</body>
</html>
